        <g fill="url(#pea-round)" stroke="#7c9e4e" stroke-width="1.4">
          <circle cx="141" cy="274" r="20"/><circle cx="193" cy="261" r="25"/>
          <circle cx="251" cy="249" r="28"/><circle cx="313" cy="239" r="30"/>
          <circle cx="376" cy="231" r="29"/><circle cx="437" cy="226" r="26"/>
